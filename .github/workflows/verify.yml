name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    # Postgres service container for verify_postgres_store.py — see that
    # script's own docstring for why it's the one harness here that needs a
    # real database rather than a scratch SQLite file. `postgres:16` matches
    # the Cloud SQL version used in production (see CLAUDE.md's deploy plan).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Every harness here is free — no PERPLEXITY_API_KEY/GROQ_API_KEY calls.
      # The quant pair reads live yfinance data; the rest run TestClient
      # against a scratch ARGUS_DB with provider keys blanked.
      - run: python scripts/verify_quant.py
      - run: python scripts/verify_metric_status.py
      - run: python scripts/verify_ticker_validation.py
      - run: python scripts/verify_proxy_trust.py
      - run: python scripts/verify_hardening.py
      - run: python scripts/verify_consistency.py
      - run: python scripts/verify_docs.py
      - run: python scripts/verify_access.py
      - run: python scripts/verify_onboarding.py
      - run: python scripts/verify_byok_visitor.py
      - run: python scripts/verify_postgres_store.py
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
